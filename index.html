<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地図メニュー</title>
    <style>
        body {
            margin: 0;
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 720px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 32px;
        }

		.menu {
		    display: grid;
		    grid-template-columns: repeat(2, 1fr); /* 2列 */
		    gap: 10px;                             /* ボタン間隔 */
		    max-width: 500px;                      /* 必要に応じて変更 */
		    margin: 0 auto;
		}

		.menu a {
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    padding: 12px;
		    background: #007bff;
		    color: white;
		    text-decoration: none;
		    border-radius: 5px;
		    font-size: 16px;
		    font-weight: bold;
		}

        /* 点検結果ラベル */
        .result-label {
            grid-column: 1 / -1;
            padding: 10px 12px;
            background: #ca6503;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        /* 点検結果ラベル直下のボタン */
        .menu a.result-button {
            background: #f28c28;
        }

        .menu-spacer {
            grid-column: 1 / -1;
            height: 24px; /* 2行目と3行目の空白 */
        }

        .menu a:hover {
            opacity: 0.85;
        }

	.past-menu {
	    max-width: 500px;
	    margin: 60px auto 0;   /* 上に約3行分の余白 */
	}

	.past-menu a {
	    display: flex;
	    justify-content: center;
	    align-items: center;
	    padding: 12px;
	    background: #666;
	    color: white;
	    text-decoration: none;
	    border-radius: 5px;
	    font-size: 16px;
	    font-weight: bold;
	}

	.past-menu a:hover {
	    opacity: 0.85;
	}

    </style>
</head>
<body>
    <div class="container">
        <h1>舗装点検区間</h1>

        <div class="menu">
            <a href="./map_mikan/map.html" target="_mitenken" rel="noopener noreferrer">未点検区間<br>2026/09/09時点</a>
            <a href="./map_20/map.html" target="_20" rel="noopener noreferrer">未点検区間<br>20m単位の座標</a>
            <a href="./map_konnen_up/map.html" target="_konup" rel="noopener noreferrer">今年度点検箇所・上り</a>
            <a href="./map_konnen_down/map.html" target="_kondown" rel="noopener noreferrer">今年度点検箇所・下り</a>
            <div class="menu-spacer"></div>
			<div class="result-label">点検結果2026/09/28時点</div>
            <a class="result-button" href="./map_kekka_kyoto/map.html" target="_mitenken" rel="noopener noreferrer">京都国道</a>
            <a class="result-button" href="./map_kekka_nara/map.html" target="_mitenken" rel="noopener noreferrer">奈良国道</a>
            <a class="result-button" href="./map_kekka_wakayama/map.html" target="_mitenken" rel="noopener noreferrer">和歌山河川</a>
            <a class="result-button" href="./map_kekka_kinan/map.html" target="_mitenken" rel="noopener noreferrer">紀南河川</a>
        </div>

		<div class="past-menu">
		    <a href="./index2.html" target="_past" rel="noopener noreferrer">過去の地図</a>
		</div>

		<div class="qr-code">
		    <img src="./QR.png" alt="QRコード">
		</div>

    </div>
</body>
</html>
